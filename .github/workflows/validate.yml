name: Validate research supplement

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.13']
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MPLBACKEND: Agg
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify archived bytes and research tables
        run: python scripts/verify_package.py
      - name: Install recorded numerical dependencies
        run: python -m pip install -r MODEL2C/requirements.txt
      - name: Run regression tests
        run: python -B MODEL2C/test_primitif.py
      - name: Check portable checkpoint reader
        run: python -B scripts/read_checkpoint.py data/reference/utama_seed2026/medicoes_portable/clefia.json
      - name: Run a small pipeline smoke check
        run: python -B MODEL2C/bandingkan.py --cepat --primitif alzette --kunci 0 --output-dir results/ci-smoke

  sparkle-c:
    name: SPARKLE C / Python ${{ matrix.python-version }} / ${{ matrix.optimization }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']
        optimization: ['O0', 'O2']
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify retained source and archived data
        run: python scripts/verify_package.py
      - name: Install recorded NumPy version
        run: python -m pip install numpy==2.2.6
      - name: Compile retained official SPARKLE C v1.2.1
        run: |
          mkdir -p results/sparkle-c
          gcc -std=c99 -Wall -Wextra -Werror -${{ matrix.optimization }} third_party/sparkle/sparkle_ref.c third_party/sparkle/driver.c -o results/sparkle-c/sparkle_ref
      - name: Compare every step against Python scalar and batch
        run: >-
          python -B MODEL2C/validasi_referensi_linux.py
          --executable results/sparkle-c/sparkle_ref
          --output results/sparkle-c/validation.json
          --random-inputs 1024
          --seed 752026
          --compiler gcc
          --build-command "gcc -std=c99 -Wall -Wextra -Werror -${{ matrix.optimization }} third_party/sparkle/sparkle_ref.c third_party/sparkle/driver.c -o results/sparkle-c/sparkle_ref"
      - name: Preserve machine-readable conformance evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sparkle-c-py${{ matrix.python-version }}-${{ matrix.optimization }}
          path: results/sparkle-c/validation.json
          if-no-files-found: error
          retention-days: 90

  directed-sac:
    name: Check directed SAC evidence and conformance
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install recorded statistical dependencies
        run: python -m pip install -r experiments/sac_confirm/requirements.txt
      - name: Check scalar conformance and detector construction
        run: python -B experiments/sac/test_comparison.py
      - name: Verify directed SAC evidence and paired statistics
        run: python -B experiments/sac/verify_comparison.py --input data/followup/sac_directed_2026-11-10
      - name: Check size-matching rules and small end-to-end pipeline
        run: python -B experiments/sac_size/test_size_match.py
      - name: Verify size-matched reanalysis and held-out null records
        run: python -B experiments/sac_size/verify_size_match.py --input data/followup/sac_size_matched_2026-11-11
      - name: Check explicit-key scalar conformance and fresh-input pipeline
        run: python -B experiments/sac_confirm/test_confirmation.py
      - name: Verify fresh-input key confirmation and native snapshots
        run: python -B experiments/sac_confirm/verify_confirmation.py --input data/followup/sac_fresh_keys_2026-11-11 --regenerate-snapshots
